name: Secret-scanning alert watchdog

# Why this exists:
# GitHub's push protection blocks pushes containing recognized secrets, and the
# Security -> Secret scanning alerts dashboard records secrets that ACTUALLY
# LAND in the repo (e.g. a bypassed push, or a secret type push protection
# does not cover). Blocked (non-bypassed) pushes create no alert, so a
# non-empty open-alerts list means a real secret is live in the repo and must
# be rotated. Today the only signal is that browser dashboard — nobody looks
# at it. This job polls the alerts API and turns red where the team already
# looks: the Actions list.
#
# Trigger design (mirrors pat-expiry-watchdog.yml):
# - push: every push runs this check. Push-triggered workflows cannot be
#   auto-disabled, so this is the primary warning path.
# - schedule: a daily cron catches the "no pushes happening" case. Note that
#   GitHub disables scheduled workflows after 60 days of repository
#   inactivity, so a silent repo eventually silences this signal too — the
#   same accepted limitation the PAT watchdog documents.
#
# Auth: the secret-scanning alerts API is NOT reachable with the workflow's
# automatic GITHUB_TOKEN — GitHub hard-blocks it (403 "Resource not accessible
# by integration"; security-events: read does not cover this endpoint
# family). The job therefore authenticates with the CAS_ALERT_SCAN_PAT
# repository Actions secret, which holds a DEDICATED fine-grained PAT scoped
# to this repo with ONLY "Secret scanning alerts: Read". It must stay
# least-privilege: this job runs on pushes to any branch, so never point it
# at the workspace's push-capable GITHUB_PAT (a collaborator's branch
# workflow could then borrow those write powers). The dedicated token has its
# own expiry; when it lapses the API returns 401 and this job fails red —
# mint a fresh scan-only PAT and update the CAS_ALERT_SCAN_PAT repo secret.
# Any non-200 fails the job: an unknown alert state must never look green.
#
# Testing: dispatch manually with simulate_alert_count set to a positive
# integer to prove the red path without leaking a real secret.

on:
  push:
  schedule:
    - cron: "42 7 * * *" # daily, offset from the PAT expiry watchdog (17 7 * * *)
  workflow_dispatch:
    inputs:
      simulate_alert_count:
        description: "Pretend this many alerts are open, to test the failure path (e.g. 3). Empty = use the real API result."
        required: false
        default: ""

env:
  DASHBOARD_URL: "https://github.com/21mCom/CAS_ANDROID/security/secret-scanning"
  SIM_ALERT_COUNT: ${{ github.event.inputs.simulate_alert_count }}

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any secret-scanning alert is open
        env:
          GH_TOKEN: ${{ secrets.CAS_ALERT_SCAN_PAT }}
        run: |
          if [ -n "$SIM_ALERT_COUNT" ]; then
            if ! [[ "$SIM_ALERT_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::simulate_alert_count must be a positive integer, got '${SIM_ALERT_COUNT}'. Leave it empty to use the real API."
              exit 1
            fi
            open_count="$SIM_ALERT_COUNT"
            echo "SIMULATED: pretending ${open_count} open alert(s)."
          else
            page=1
            open_count=0
            while :; do
              response=$(curl -sS -w '\n%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100&page=${page}")
              http_code=$(printf '%s\n' "$response" | tail -n1)
              body=$(printf '%s\n' "$response" | sed '$d')
              if [ "$http_code" != "200" ]; then
                echo "::error::Secret-scanning alerts API returned HTTP ${http_code}, not 200 — the repo's alert state is UNKNOWN, so this run cannot pass. Likely causes: the CAS_ALERT_SCAN_PAT repo secret is missing, or its token lapsed/lost the 'Secret scanning alerts' permission (rotate per pat-expiry-watchdog.yml's steps AND update this repo secret), or Secret Protection was disabled on the repo. Dashboard: ${DASHBOARD_URL}"
                exit 1
              fi
              page_count=$(printf '%s' "$body" | jq 'length')
              open_count=$((open_count + page_count))
              [ "$page_count" -lt 100 ] && break
              page=$((page + 1))
            done
          fi
          if [ "$open_count" -gt 0 ]; then
            echo "::error::${open_count} open secret-scanning alert(s) on ${GITHUB_REPOSITORY} — a real secret has LANDED in the repo. Rotate/revoke the leaked credential first, then resolve the alert(s) here: ${DASHBOARD_URL}"
            exit 1
          fi
          echo "OK: zero open secret-scanning alerts."
