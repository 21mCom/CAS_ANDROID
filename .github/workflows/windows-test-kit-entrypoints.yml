name: Windows test-kit entry points

on:
  pull_request:
    paths:
      - ".github/workflows/windows-test-kit-entrypoints.yml"
      - "artifacts/covert-alert-system/package.json"
      - "artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1"
      - "artifacts/covert-alert-system/scripts/build-android-test-apk.ps1"
      - "artifacts/covert-alert-system/scripts/package-windows-test-kit.ps1"
      - "artifacts/covert-alert-system/android-test-package/scripts/**"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/src/lib/gate0a-report.ts"
      - "artifacts/api-server/scripts/validate-gate0a-report.ts"
  push:
    paths:
      - ".github/workflows/windows-test-kit-entrypoints.yml"
      - "artifacts/covert-alert-system/package.json"
      - "artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1"
      - "artifacts/covert-alert-system/scripts/build-android-test-apk.ps1"
      - "artifacts/covert-alert-system/scripts/package-windows-test-kit.ps1"
      - "artifacts/covert-alert-system/android-test-package/scripts/**"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/src/lib/gate0a-report.ts"
      - "artifacts/api-server/scripts/validate-gate0a-report.ts"
  workflow_dispatch:

# Field operators run the ZIP produced by package-windows-test-kit.ps1, not the
# repository checkout. Every check below therefore runs against the packaged
# copy: the first job builds the ZIP exactly as a field packager would, and the
# check jobs extract it and test only what the ZIP contains. A packaging
# regression that drops, renames, or stale-copies a script fails the build
# instead of shipping a broken kit.

jobs:
  package-kit:
    name: Build the Windows test kit ZIP
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package the Windows test kit
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'CAS-Pixel11-Windows-Test-Kit-v6.zip'
          # The APK build gate is covered by the "Android test package build"
          # workflow; packaging still runs the repo-copy entry-point gate itself.
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File artifacts/covert-alert-system/scripts/package-windows-test-kit.ps1 -SkipApkBuild -OutputPath $zipPath
          if ($LASTEXITCODE -ne 0) { throw "package-windows-test-kit.ps1 exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) { throw "Packaging reported success but $zipPath is missing." }

      - name: Upload the Windows test kit
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-kit
          path: ${{ runner.temp }}/CAS-Pixel11-Windows-Test-Kit-v6.zip
          retention-days: 7

  windows-entrypoints:
    name: Windows PowerShell launcher smoke checks
    runs-on: windows-latest
    timeout-minutes: 10
    needs: package-kit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the packaged Windows test kit
        uses: actions/download-artifact@v4
        with:
          name: windows-test-kit
          path: ${{ runner.temp }}

      - name: Extract the packaged Windows test kit
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP 'packaged-windows-test-kit'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'CAS-Pixel11-Windows-Test-Kit-v6.zip') -DestinationPath $extractRoot -Force
          $kitRoot = Join-Path $extractRoot 'CAS-Pixel11-Windows-Test-Kit-v6'
          if (-not (Test-Path -LiteralPath $kitRoot -PathType Container)) { throw "The packaged ZIP does not contain the expected kit root: $kitRoot" }
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGED_KIT_ROOT=$kitRoot"

      - name: Verify the packaged kit matches the repository checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = [System.IO.Path]::GetFullPath('artifacts/covert-alert-system/android-test-package')
          $packagedRoot = [System.IO.Path]::GetFullPath($env:PACKAGED_KIT_ROOT)
          # package-windows-test-kit.ps1 intentionally strips Gradle outputs; a
          # field workstation regenerates them via the APK build gate.
          $excludedPrefixes = @('.gradle/', 'app/build/')

          function Get-RelativeFilePaths([string]$Root) {
              @(Get-ChildItem -LiteralPath $Root -Recurse -File | ForEach-Object {
                  $_.FullName.Substring($Root.Length).TrimStart('\', '/') -replace '\\', '/'
              })
          }

          $repoFiles = @(Get-RelativeFilePaths $repoRoot | Where-Object {
              $relative = $_
              -not @($excludedPrefixes | Where-Object { $relative.StartsWith($_) })
          })
          $packagedFiles = @(Get-RelativeFilePaths $packagedRoot)

          $missing = @($repoFiles | Where-Object { $packagedFiles -notcontains $_ })
          $unexpected = @($packagedFiles | Where-Object { $repoFiles -notcontains $_ })
          if ($missing.Count -gt 0 -or $unexpected.Count -gt 0) {
              $missing | ForEach-Object { Write-Host "MISSING from package: $_" }
              $unexpected | ForEach-Object { Write-Host "UNEXPECTED in package: $_" }
              throw ("The packaged kit file set differs from the repository checkout ({0} missing, {1} unexpected)." -f $missing.Count, $unexpected.Count)
          }

          foreach ($relative in $repoFiles) {
              $repoHash = (Get-FileHash -LiteralPath (Join-Path $repoRoot $relative) -Algorithm SHA256).Hash
              $packagedHash = (Get-FileHash -LiteralPath (Join-Path $packagedRoot $relative) -Algorithm SHA256).Hash
              if ($repoHash -ne $packagedHash) {
                  throw "Packaged file content differs from the repository checkout: $relative"
              }
          }
          Write-Host ("Packaged kit matches the repository checkout ({0} files verified)." -f $repoFiles.Count)

      - name: Run entry-point checks against the packaged kit
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1 -PackageRoot $env:PACKAGED_KIT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "test-windows-entrypoints.ps1 exited $LASTEXITCODE" }

  git-bash-report:
    name: Gate 0A report generation under Git Bash
    runs-on: windows-latest
    timeout-minutes: 10
    needs: package-kit

    steps:
      - name: Download the packaged Windows test kit
        uses: actions/download-artifact@v4
        with:
          name: windows-test-kit
          path: ${{ runner.temp }}

      - name: Extract the packaged Windows test kit
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP 'packaged-windows-test-kit'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'CAS-Pixel11-Windows-Test-Kit-v6.zip') -DestinationPath $extractRoot -Force
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGED_KIT_ROOT=$(Join-Path $extractRoot 'CAS-Pixel11-Windows-Test-Kit-v6')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate a Gate 0A report from synthetic events in Git Bash
        shell: bash
        run: |
          set -euo pipefail
          # Native Windows Python cannot read MSYS /c/... paths; the harness must
          # convert via cygpath. Ensure a python3 command exists for Git Bash.
          if ! command -v python3 >/dev/null 2>&1; then
            shim_dir="$RUNNER_TEMP/python3-shim"
            mkdir -p "$shim_dir"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$shim_dir/python3"
            chmod +x "$shim_dir/python3"
            export PATH="$shim_dir:$PATH"
          fi
          # Exercise the packaged copy: field operators run the ZIP, not the checkout.
          harness="$(cygpath "$PACKAGED_KIT_ROOT")/scripts/measure-gate0a.sh"
          out_parent="$RUNNER_TEMP/gate0a-report-selftest"
          rm -rf "$out_parent"
          set +e
          output="$("$harness" --report-self-test --out-dir "$out_parent" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -ne 0 ]]; then
            echo "Report self-test exited $code." >&2
            exit 1
          fi
          run_dir="$(printf '%s\n' "$output" | sed -n 's/.*CAS_GATE0A_REPORT_SELF_TEST_OK runDir=//p' | tail -n 1 | tr -d '\r')"
          if [[ -z "$run_dir" ]]; then
            echo "The harness exited 0 but did not report a successful report self-test." >&2
            exit 1
          fi
          echo "GATE0A_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          # Independent verification: never trust the exit code or log alone.
          test -s "$run_dir/report.json" || { echo "report.json is missing from $run_dir" >&2; exit 1; }
          test -s "$run_dir/report.md" || { echo "report.md is missing from $run_dir" >&2; exit 1; }
          python - "$(cygpath -w "$run_dir/report.json")" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schema"] == "cas-gate0a-report-v2", report["schema"]
          assert report["status"] == "complete-with-failures", report["status"]
          print("report.json parsed; status:", report["status"])
          PYEOF

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install API server dependencies
        run: pnpm install --filter @workspace/api-server...

      - name: The self-test report must pass the web app's import validation
        shell: bash
        run: |
          set -euo pipefail
          # Runs the same validateGate0aImport rules as POST /api/cas/gate0a/import,
          # so a harness/app schema drift fails here instead of in the field.
          pnpm --filter @workspace/api-server run validate:gate0a-report \
            "$(cygpath -w "$GATE0A_RUN_DIR/report.json")"

      - name: A report the app would reject must fail validation
        shell: bash
        run: |
          set -euo pipefail
          drifted="$RUNNER_TEMP/gate0a-report-drifted.json"
          python - "$(cygpath -w "$GATE0A_RUN_DIR/report.json")" "$(cygpath -w "$drifted")" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          report["schema"] = "cas-gate0a-report-v1"
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(report, handle)
          PYEOF
          set +e
          output="$(pnpm --filter @workspace/api-server run validate:gate0a-report "$(cygpath -w "$drifted")" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -eq 0 ]]; then
            echo "The validator accepted a report the web app would reject." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q "REJECTED" || {
            echo "The validator failed without reporting a rejection reason." >&2
            exit 1
          }
          echo "Drifted report rejected by the app's import validation, as required."

      - name: A failed report write must not exit successfully
        shell: bash
        run: |
          set -euo pipefail
          # Force write_report() to fail by shadowing python3 with a broken shim.
          shim_dir="$RUNNER_TEMP/broken-python3"
          mkdir -p "$shim_dir"
          printf '#!/usr/bin/env bash\nexit 1\n' > "$shim_dir/python3"
          chmod +x "$shim_dir/python3"
          harness="$(cygpath "$PACKAGED_KIT_ROOT")/scripts/measure-gate0a.sh"
          out_parent="$RUNNER_TEMP/gate0a-report-negative"
          rm -rf "$out_parent"
          set +e
          PATH="$shim_dir:$PATH" "$harness" --report-self-test --out-dir "$out_parent" > "$RUNNER_TEMP/gate0a-negative.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/gate0a-negative.log"
          if [[ $code -eq 0 ]]; then
            echo "The harness exited 0 although python3 failed and no report could be written." >&2
            exit 1
          fi
          if find "$out_parent" \( -name report.json -o -name report.md \) 2>/dev/null | grep -q .; then
            echo "A report file exists even though the report write failed." >&2
            exit 1
          fi
          echo "Blocked report write produced a non-zero exit and no report files."
