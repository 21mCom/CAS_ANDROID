name: Windows test-kit entry points

on:
  pull_request:
    paths:
      - ".github/workflows/windows-test-kit-entrypoints.yml"
      - "artifacts/covert-alert-system/package.json"
      - "artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1"
      - "artifacts/covert-alert-system/android-test-package/scripts/**"
  push:
    paths:
      - ".github/workflows/windows-test-kit-entrypoints.yml"
      - "artifacts/covert-alert-system/package.json"
      - "artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1"
      - "artifacts/covert-alert-system/android-test-package/scripts/**"
  workflow_dispatch:

jobs:
  windows-entrypoints:
    name: Windows PowerShell launcher smoke checks
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Run Windows PowerShell and CMD entry-point checks
        run: pnpm --filter @workspace/covert-alert-system run test:windows-entrypoints
