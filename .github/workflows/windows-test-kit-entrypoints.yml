name: Windows test-kit entry points

on:
  pull_request:
    paths:
      - ".github/workflows/windows-test-kit-entrypoints.yml"
      - ".github/scripts/check-tool-requirements-drift.py"
      - ".github/scripts/check-hardcoded-api-floor.py"
      - ".github/scripts/check-hardcoded-jdk-minimum.py"
      - "artifacts/covert-alert-system/package.json"
      - "artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1"
      - "artifacts/covert-alert-system/scripts/build-android-test-apk.ps1"
      - "artifacts/covert-alert-system/scripts/package-windows-test-kit.ps1"
      - "artifacts/covert-alert-system/android-test-package/scripts/**"
      - "artifacts/covert-alert-system/android-test-package/tool-requirements.json"
      - "artifacts/covert-alert-system/android-test-package/README.md"
      - "artifacts/covert-alert-system/android-test-package/START-HERE-WINDOWS.md"
      - "artifacts/covert-alert-system/android-test-package/docs/**"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/src/lib/gate0a-report.ts"
      - "artifacts/api-server/scripts/validate-gate0a-report.ts"
      - "scripts/generate-gate0a-hardware-report-fixture.sh"
      - "scripts/check-tool-requirements-parity.sh"
      - "scripts/fixtures/tool-requirements-parity/**"
  push:
    paths:
      - ".github/workflows/windows-test-kit-entrypoints.yml"
      - ".github/scripts/check-tool-requirements-drift.py"
      - ".github/scripts/check-hardcoded-api-floor.py"
      - ".github/scripts/check-hardcoded-jdk-minimum.py"
      - "artifacts/covert-alert-system/package.json"
      - "artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1"
      - "artifacts/covert-alert-system/scripts/build-android-test-apk.ps1"
      - "artifacts/covert-alert-system/scripts/package-windows-test-kit.ps1"
      - "artifacts/covert-alert-system/android-test-package/scripts/**"
      - "artifacts/covert-alert-system/android-test-package/tool-requirements.json"
      - "artifacts/covert-alert-system/android-test-package/README.md"
      - "artifacts/covert-alert-system/android-test-package/START-HERE-WINDOWS.md"
      - "artifacts/covert-alert-system/android-test-package/docs/**"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/src/lib/gate0a-report.ts"
      - "artifacts/api-server/scripts/validate-gate0a-report.ts"
      - "scripts/generate-gate0a-hardware-report-fixture.sh"
      - "scripts/check-tool-requirements-parity.sh"
      - "scripts/fixtures/tool-requirements-parity/**"
  workflow_dispatch:

# Field operators run the ZIP produced by package-windows-test-kit.ps1, not the
# repository checkout. Every check below therefore runs against the packaged
# copy: the first job builds the ZIP exactly as a field packager would, and the
# check jobs extract it and test only what the ZIP contains. A packaging
# regression that drops, renames, or stale-copies a script fails the build
# instead of shipping a broken kit.

jobs:
  package-kit:
    name: Build the Windows test kit ZIP
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package the Windows test kit
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'CAS-Pixel11-Windows-Test-Kit-v6.zip'
          # The APK build gate is covered by the "Android test package build"
          # workflow; packaging still runs the repo-copy entry-point gate itself.
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File artifacts/covert-alert-system/scripts/package-windows-test-kit.ps1 -SkipApkBuild -OutputPath $zipPath
          if ($LASTEXITCODE -ne 0) { throw "package-windows-test-kit.ps1 exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) { throw "Packaging reported success but $zipPath is missing." }

      - name: Upload the Windows test kit
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-kit
          path: ${{ runner.temp }}/CAS-Pixel11-Windows-Test-Kit-v6.zip
          retention-days: 7

  windows-entrypoints:
    name: Windows PowerShell launcher smoke checks
    runs-on: windows-latest
    timeout-minutes: 10
    needs: package-kit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the packaged Windows test kit
        uses: actions/download-artifact@v4
        with:
          name: windows-test-kit
          path: ${{ runner.temp }}

      - name: Extract the packaged Windows test kit
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP 'packaged-windows-test-kit'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'CAS-Pixel11-Windows-Test-Kit-v6.zip') -DestinationPath $extractRoot -Force
          $kitRoot = Join-Path $extractRoot 'CAS-Pixel11-Windows-Test-Kit-v6'
          if (-not (Test-Path -LiteralPath $kitRoot -PathType Container)) { throw "The packaged ZIP does not contain the expected kit root: $kitRoot" }
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGED_KIT_ROOT=$kitRoot"

      - name: Verify the packaged kit matches the repository checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = [System.IO.Path]::GetFullPath('artifacts/covert-alert-system/android-test-package')
          $packagedRoot = [System.IO.Path]::GetFullPath($env:PACKAGED_KIT_ROOT)
          # package-windows-test-kit.ps1 intentionally strips Gradle outputs; a
          # field workstation regenerates them via the APK build gate.
          $excludedPrefixes = @('.gradle/', 'app/build/')

          function Get-RelativeFilePaths([string]$Root) {
              @(Get-ChildItem -LiteralPath $Root -Recurse -File | ForEach-Object {
                  $_.FullName.Substring($Root.Length).TrimStart('\', '/') -replace '\\', '/'
              })
          }

          $repoFiles = @(Get-RelativeFilePaths $repoRoot | Where-Object {
              $relative = $_
              -not @($excludedPrefixes | Where-Object { $relative.StartsWith($_) })
          })
          $packagedFiles = @(Get-RelativeFilePaths $packagedRoot)

          $missing = @($repoFiles | Where-Object { $packagedFiles -notcontains $_ })
          $unexpected = @($packagedFiles | Where-Object { $repoFiles -notcontains $_ })
          if ($missing.Count -gt 0 -or $unexpected.Count -gt 0) {
              $missing | ForEach-Object { Write-Host "MISSING from package: $_" }
              $unexpected | ForEach-Object { Write-Host "UNEXPECTED in package: $_" }
              throw ("The packaged kit file set differs from the repository checkout ({0} missing, {1} unexpected)." -f $missing.Count, $unexpected.Count)
          }

          foreach ($relative in $repoFiles) {
              $repoHash = (Get-FileHash -LiteralPath (Join-Path $repoRoot $relative) -Algorithm SHA256).Hash
              $packagedHash = (Get-FileHash -LiteralPath (Join-Path $packagedRoot $relative) -Algorithm SHA256).Hash
              if ($repoHash -ne $packagedHash) {
                  throw "Packaged file content differs from the repository checkout: $relative"
              }
          }
          Write-Host ("Packaged kit matches the repository checkout ({0} files verified)." -f $repoFiles.Count)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Packaged docs and scripts must agree with tool-requirements.json
        shell: pwsh
        run: |
          # tool-requirements.json declares the JDK minimum, SDK platform, and
          # build-tools minimum once; the docs reference it. This gate greps the
          # packaged kit for reintroduced literals that disagree with the
          # declaration, so a future edit cannot silently fork the guidance again.
          python .github/scripts/check-tool-requirements-drift.py $env:PACKAGED_KIT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "check-tool-requirements-drift.py exited $LASTEXITCODE" }

      - name: Packaged scripts must not hardcode the Android API floor
        shell: pwsh
        run: |
          # The drift gate above only catches literals that DISAGREE with
          # tool-requirements.json. A script that hardcodes the currently
          # declared floor (-lt 35, "API 35 or newer") passes that gate while
          # silently forking the floor at the next declaration bump; this
          # drift class has already occurred twice (measure-gate0a.sh and
          # mvp-install.ps1). This gate rejects API-level literals and
          # comparisons in scripts outright, so scripts must derive the floor
          # from the declaration.
          python .github/scripts/check-hardcoded-api-floor.py $env:PACKAGED_KIT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "check-hardcoded-api-floor.py exited $LASTEXITCODE" }

      - name: A hardcoded API floor matching the declaration must fail the hardcode gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Negative test: inject literals EQUAL to the currently declared
          # floor, so the drift gate stays green and only the hardcode gate
          # can turn red. Only the copy is modified; the packaged kit stays
          # clean for the entry-point checks below.
          $hardcodeCopy = Join-Path $env:RUNNER_TEMP 'apifloor-hardcode-negative'
          if (Test-Path -LiteralPath $hardcodeCopy) { Remove-Item -Recurse -Force $hardcodeCopy }
          Copy-Item -Recurse -LiteralPath $env:PACKAGED_KIT_ROOT -Destination $hardcodeCopy
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\mvp-install.ps1') -Value ''
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\mvp-install.ps1') -Value 'if ([int]$api -lt 35) { Stop-Run "This build requires API 35 or newer." }'
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\measure-gate0a.sh') -Value ''
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\measure-gate0a.sh') -Value '[[ "$DEVICE_API" -lt 35 ]] && die "device too old"'
          # The injected literals agree with tool-requirements.json, so the
          # drift gate must still accept the copy. The native commands below
          # are expected to exit non-zero; do not let pwsh 7.4+ turn the exit
          # code into a terminating error before the assertions run.
          $PSNativeCommandUseErrorActionPreference = $false
          $driftOutput = & python .github/scripts/check-tool-requirements-drift.py $hardcodeCopy 2>&1 | Out-String
          $driftCode = $LASTEXITCODE
          Write-Host $driftOutput
          if ($driftCode -ne 0) { throw 'Test setup broken: literals matching the declaration must pass the drift gate; only the hardcode gate may turn red.' }
          $output = & python .github/scripts/check-hardcoded-api-floor.py $hardcodeCopy 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -eq 0) { throw 'The hardcode gate accepted scripts that re-hardcode the Android API floor.' }
          if ($output -notmatch 'mvp-install\.ps1') { throw 'The gate failed without naming the drifted installer script.' }
          if ($output -notmatch 'measure-gate0a\.sh') { throw 'The gate failed without naming the drifted harness script.' }
          if ($output -notmatch 'API-level comparison' -or $output -notmatch 'API keyword literal') {
              throw 'The gate failed without identifying the hardcoded comparison and API keyword literal.'
          }
          Write-Host 'Hardcoded API-floor literals turned the gate red while the drift gate stayed green, as required.'

      - name: Packaged scripts must not hardcode the JDK minimum
        shell: pwsh
        run: |
          # The same bypass the API-floor gate closes exists on the JDK axis:
          # a bare comparison like `-lt 17` carries no JDK keyword (so the
          # drift gate never matches it) and sits below the API-floor gate's
          # comparison band. This sibling gate rejects comparisons against
          # plausible JDK majors in scripts outright, so scripts must derive
          # the minimum from tool-requirements.json.
          python .github/scripts/check-hardcoded-jdk-minimum.py $env:PACKAGED_KIT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "check-hardcoded-jdk-minimum.py exited $LASTEXITCODE" }

      - name: A hardcoded JDK minimum matching the declaration must fail the JDK hardcode gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Negative test: inject bare comparisons EQUAL to the currently
          # declared JDK minimum, so the drift gate (no keyword literal) and
          # the API-floor gate (value below its comparison band) stay green
          # and only the JDK hardcode gate can turn red. Only the copy is
          # modified; the packaged kit stays clean for the entry-point checks
          # below.
          $hardcodeCopy = Join-Path $env:RUNNER_TEMP 'jdkfloor-hardcode-negative'
          if (Test-Path -LiteralPath $hardcodeCopy) { Remove-Item -Recurse -Force $hardcodeCopy }
          Copy-Item -Recurse -LiteralPath $env:PACKAGED_KIT_ROOT -Destination $hardcodeCopy
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\mvp-install.ps1') -Value ''
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\mvp-install.ps1') -Value 'if ([int]$javaMajor -lt 17) { Stop-Run "This build requires a newer Java runtime." }'
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\measure-gate0a.sh') -Value ''
          Add-Content -LiteralPath (Join-Path $hardcodeCopy 'scripts\measure-gate0a.sh') -Value '[[ "$JAVA_MAJOR" -lt 17 ]] && die "java runtime too old"'
          # The injected comparisons carry no keyword literal and sit below
          # the API-floor band, so the drift gate and the API-floor gate must
          # both still accept the copy. The native commands below are expected
          # to exit non-zero; do not let pwsh 7.4+ turn the exit code into a
          # terminating error before the assertions run.
          $PSNativeCommandUseErrorActionPreference = $false
          $driftOutput = & python .github/scripts/check-tool-requirements-drift.py $hardcodeCopy 2>&1 | Out-String
          $driftCode = $LASTEXITCODE
          Write-Host $driftOutput
          if ($driftCode -ne 0) { throw 'Test setup broken: keyword-free comparisons must pass the drift gate; only the JDK hardcode gate may turn red.' }
          $apiOutput = & python .github/scripts/check-hardcoded-api-floor.py $hardcodeCopy 2>&1 | Out-String
          $apiCode = $LASTEXITCODE
          Write-Host $apiOutput
          if ($apiCode -ne 0) { throw 'Test setup broken: comparisons below the API band must pass the API-floor gate; only the JDK hardcode gate may turn red.' }
          $output = & python .github/scripts/check-hardcoded-jdk-minimum.py $hardcodeCopy 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -eq 0) { throw 'The JDK hardcode gate accepted scripts that re-hardcode the declared JDK minimum.' }
          if ($output -notmatch 'mvp-install\.ps1') { throw 'The gate failed without naming the drifted installer script.' }
          if ($output -notmatch 'measure-gate0a\.sh') { throw 'The gate failed without naming the drifted harness script.' }
          if ($output -notmatch 'JDK-major comparison') { throw 'The gate failed without identifying the hardcoded JDK-major comparisons.' }
          Write-Host 'Hardcoded JDK-minimum comparisons turned the gate red while the drift and API-floor gates stayed green, as required.'

      - name: A reintroduced stale literal must fail the drift gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Negative test: copy the packaged kit, inject literals that disagree
          # with tool-requirements.json, and require the gate to turn red on the
          # exact file/line. Only the copy is modified; the packaged kit stays
          # clean for the entry-point checks below.
          $driftCopy = Join-Path $env:RUNNER_TEMP 'toolreq-drift-negative'
          if (Test-Path -LiteralPath $driftCopy) { Remove-Item -Recurse -Force $driftCopy }
          Copy-Item -Recurse -LiteralPath $env:PACKAGED_KIT_ROOT -Destination $driftCopy
          Add-Content -LiteralPath (Join-Path $driftCopy 'START-HERE-WINDOWS.md') -Value ''
          Add-Content -LiteralPath (Join-Path $driftCopy 'START-HERE-WINDOWS.md') -Value 'Requires JDK 21 or newer and platforms;android-34 with build-tools;34.0.0.'
          # A declared-value occurrence first on the line must not hide a stale
          # literal of the same kind later on the same line.
          Add-Content -LiteralPath (Join-Path $driftCopy 'START-HERE-WINDOWS.md') -Value 'The kit declares JDK 17; do not confuse it with legacy JDK 21 setups.'
          # The gate is expected to exit non-zero here; do not let pwsh 7.4+ turn
          # the native command's exit code into a terminating error before the
          # assertions below run.
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & python .github/scripts/check-tool-requirements-drift.py $driftCopy 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -eq 0) { throw 'The drift gate accepted reintroduced literals that disagree with tool-requirements.json.' }
          if ($output -notmatch 'START-HERE-WINDOWS\.md') { throw 'The gate failed without naming the drifted file.' }
          if ($output -notmatch 'JDK major literal' -or $output -notmatch 'SDK platform literal' -or $output -notmatch 'build-tools literal') {
              throw 'The gate failed without identifying the drifted JDK, SDK platform, and build-tools literals.'
          }
          Write-Host 'Reintroduced stale literals turned the drift gate red, as required.'

      - name: A missing tool-requirements.json must block the packaged preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Negative test: the preflight carries no built-in fallback minimums.
          # A packaged kit whose declaration file is missing was tampered with
          # or incompletely copied, so the preflight must stop with a BLOCKED
          # tools.requirements outcome instead of guessing. Only the copy is
          # modified; the packaged kit stays clean for the checks below.
          $brokenCopy = Join-Path $env:RUNNER_TEMP 'toolreq-missing-negative'
          if (Test-Path -LiteralPath $brokenCopy) { Remove-Item -Recurse -Force $brokenCopy }
          Copy-Item -Recurse -LiteralPath $env:PACKAGED_KIT_ROOT -Destination $brokenCopy
          Remove-Item -LiteralPath (Join-Path $brokenCopy 'tool-requirements.json')
          $preflight = Join-Path $brokenCopy 'scripts\windows-preflight.ps1'
          # The preflight is expected to exit non-zero here; do not let
          # pwsh 7.4+ turn the native command's exit code into a terminating
          # error before the assertions below run.
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $preflight -OutputDirectory (Join-Path $brokenCopy 'results') 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 2) { throw "The preflight exited $code although tool-requirements.json is missing; a broken kit must abort with exit 2." }
          if ($output -notmatch '\[BLOCKED\] Tool requirements declaration') { throw 'The preflight did not fail the tools.requirements check.' }
          if ($output -notmatch 'Restore the complete, unmodified test kit') { throw 'The preflight did not tell the operator to restore the kit.' }
          if ($output -match 'Java command') { throw 'The preflight continued past the missing declaration and guessed tool requirements.' }
          if (Get-ChildItem -LiteralPath $brokenCopy -Recurse -Filter 'cas-windows-preflight-*.json' -ErrorAction SilentlyContinue) { throw 'The preflight wrote a result file for a broken kit.' }
          Write-Host 'A missing tool-requirements.json blocked the preflight, as required.'

      - name: A missing gradle-version.txt must block the packaged preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Negative test: the preflight carries no built-in Gradle fallback.
          # A packaged kit whose Gradle declaration file is missing was
          # tampered with or incompletely copied, so the preflight must stop
          # with a BLOCKED gradle.expected-version outcome instead of
          # substituting a guessed release. Only the copy is modified; the
          # packaged kit stays clean for the checks below.
          $brokenCopy = Join-Path $env:RUNNER_TEMP 'gradle-decl-missing-negative'
          if (Test-Path -LiteralPath $brokenCopy) { Remove-Item -Recurse -Force $brokenCopy }
          Copy-Item -Recurse -LiteralPath $env:PACKAGED_KIT_ROOT -Destination $brokenCopy
          Remove-Item -LiteralPath (Join-Path $brokenCopy 'gradle-version.txt')
          $preflight = Join-Path $brokenCopy 'scripts\windows-preflight.ps1'
          # The preflight is expected to exit non-zero here; do not let
          # pwsh 7.4+ turn the native command's exit code into a terminating
          # error before the assertions below run.
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $preflight -OutputDirectory (Join-Path $brokenCopy 'results') 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 2) { throw "The preflight exited $code although gradle-version.txt is missing; a broken kit must abort with exit 2." }
          if ($output -notmatch '\[BLOCKED\] Gradle version declaration') { throw 'The preflight did not fail the gradle.expected-version check.' }
          if ($output -notmatch 'Restore the complete, unmodified test kit') { throw 'The preflight did not tell the operator to restore the kit.' }
          if ($output -match 'Gradle command') { throw 'The preflight continued past the missing declaration and guessed the Gradle release.' }
          if (Get-ChildItem -LiteralPath $brokenCopy -Recurse -Filter 'cas-windows-preflight-*.json' -ErrorAction SilentlyContinue) { throw 'The preflight wrote a result file for a broken kit.' }
          Write-Host 'A missing gradle-version.txt blocked the preflight, as required.'

      - name: Run entry-point checks against the packaged kit
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File artifacts/covert-alert-system/scripts/test-windows-entrypoints.ps1 -PackageRoot $env:PACKAGED_KIT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "test-windows-entrypoints.ps1 exited $LASTEXITCODE" }

  validator-parity:
    name: PowerShell and Bash tool-requirements validators agree
    runs-on: windows-latest
    timeout-minutes: 10
    needs: package-kit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the packaged Windows test kit
        uses: actions/download-artifact@v4
        with:
          name: windows-test-kit
          path: ${{ runner.temp }}

      - name: Extract the packaged Windows test kit
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP 'packaged-windows-test-kit'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'CAS-Pixel11-Windows-Test-Kit-v6.zip') -DestinationPath $extractRoot -Force
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGED_KIT_ROOT=$(Join-Path $extractRoot 'CAS-Pixel11-Windows-Test-Kit-v6')"

      - name: Both validators must accept and reject the same declarations
        shell: bash
        run: |
          set -euo pipefail
          # The Windows entry points validate tool-requirements.json through the
          # shared PowerShell parser; the Gate 0A Bash harness carries its own
          # sed-based validation. Run the shared fixture set through BOTH sides
          # of the packaged kit and require identical accept/reject verdicts, so
          # a kit cannot pass on the workstation and fail in the field (or the
          # reverse) when the two validators drift.
          bash scripts/check-tool-requirements-parity.sh --kit-root "$(cygpath "$PACKAGED_KIT_ROOT")"

      - name: A one-sided validator change must turn the parity check red
        shell: bash
        run: |
          set -euo pipefail
          # Negative test: weaken ONLY the PowerShell parser copy so it accepts a
          # declaration with no jdk section, then require the parity check to
          # turn red on that fixture. Only the copy is modified; the packaged
          # kit stays clean.
          weakened="$RUNNER_TEMP/toolreq-parity-negative"
          rm -rf "$weakened"
          cp -r "$(cygpath "$PACKAGED_KIT_ROOT")" "$weakened"
          parser="$weakened/scripts/cas-tool-requirements.ps1"
          grep -q 'if (\$jdkMinimumMajor -lt 1 -or \$apiLevel -lt 1) {' "$parser" || {
            echo "Test setup broken: the parser no longer contains the expected jdk plausibility check to weaken." >&2
            exit 1
          }
          sed -i 's/if (\$jdkMinimumMajor -lt 1 -or \$apiLevel -lt 1) {/if ($apiLevel -lt 1) {/' "$parser"
          set +e
          output="$(bash scripts/check-tool-requirements-parity.sh --kit-root "$weakened" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -eq 0 ]]; then
            echo "The parity check accepted a kit whose PowerShell parser and Bash harness disagree." >&2
            exit 1
          fi
          grep -q 'MISMATCH.*missing-jdk\.json' <<<"$output" || {
            echo "The parity check failed without naming the fixture the two validators disagree on." >&2
            exit 1
          }
          grep -q 'TOOLREQ_PARITY_FAILED' <<<"$output" || {
            echo "The parity check failed without reporting the validator disagreement." >&2
            exit 1
          }
          echo "A one-sided validator change turned the parity check red, as required."

  git-bash-report:
    name: Gate 0A report generation under Git Bash
    runs-on: windows-latest
    timeout-minutes: 10
    needs: package-kit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the packaged Windows test kit
        uses: actions/download-artifact@v4
        with:
          name: windows-test-kit
          path: ${{ runner.temp }}

      - name: Extract the packaged Windows test kit
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP 'packaged-windows-test-kit'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'CAS-Pixel11-Windows-Test-Kit-v6.zip') -DestinationPath $extractRoot -Force
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGED_KIT_ROOT=$(Join-Path $extractRoot 'CAS-Pixel11-Windows-Test-Kit-v6')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate a Gate 0A report from synthetic events in Git Bash
        shell: bash
        run: |
          set -euo pipefail
          # Native Windows Python cannot read MSYS /c/... paths; the harness must
          # convert via cygpath. Ensure a python3 command exists for Git Bash.
          if ! command -v python3 >/dev/null 2>&1; then
            shim_dir="$RUNNER_TEMP/python3-shim"
            mkdir -p "$shim_dir"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$shim_dir/python3"
            chmod +x "$shim_dir/python3"
            export PATH="$shim_dir:$PATH"
          fi
          # Exercise the packaged copy: field operators run the ZIP, not the checkout.
          harness="$(cygpath "$PACKAGED_KIT_ROOT")/scripts/measure-gate0a.sh"
          out_parent="$RUNNER_TEMP/gate0a-report-selftest"
          rm -rf "$out_parent"
          set +e
          output="$("$harness" --report-self-test --out-dir "$out_parent" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -ne 0 ]]; then
            echo "Report self-test exited $code." >&2
            exit 1
          fi
          run_dir="$(printf '%s\n' "$output" | sed -n 's/.*CAS_GATE0A_REPORT_SELF_TEST_OK runDir=//p' | tail -n 1 | tr -d '\r')"
          if [[ -z "$run_dir" ]]; then
            echo "The harness exited 0 but did not report a successful report self-test." >&2
            exit 1
          fi
          echo "GATE0A_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          # Independent verification: never trust the exit code or log alone.
          test -s "$run_dir/report.json" || { echo "report.json is missing from $run_dir" >&2; exit 1; }
          test -s "$run_dir/report.md" || { echo "report.md is missing from $run_dir" >&2; exit 1; }
          python - "$(cygpath -w "$run_dir/report.json")" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schema"] == "cas-gate0a-report-v2", report["schema"]
          assert report["status"] == "complete-with-failures", report["status"]
          print("report.json parsed; status:", report["status"])
          PYEOF

      - name: Pinned device constants track the declared SDK platform
        shell: bash
        run: |
          set -euo pipefail
          # Step-local PATH changes do not persist between steps: establish the
          # python3 shim again (setup-python exposes python on Windows).
          if ! command -v python3 >/dev/null 2>&1; then
            shim_dir="$RUNNER_TEMP/python3-shim"
            mkdir -p "$shim_dir"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$shim_dir/python3"
            chmod +x "$shim_dir/python3"
            export PATH="$shim_dir:$PATH"
          fi
          # Drift the packaged kit's declared platform and prove the bash
          # harness's pinned-device contract (AVD name, emulator API, minimum
          # physical API, and report expectations) moves with it instead of
          # staying pinned to a hardcoded level. The kit copy is disposable;
          # restore it anyway so later steps see the unmodified kit.
          kit_root="$(cygpath "$PACKAGED_KIT_ROOT")"
          harness="$kit_root/scripts/measure-gate0a.sh"
          requirements="$kit_root/tool-requirements.json"
          cp "$requirements" "$RUNNER_TEMP/tool-requirements.json.bak"
          trap 'cp "$RUNNER_TEMP/tool-requirements.json.bak" "$requirements"' EXIT
          python - "$(cygpath -w "$requirements")" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          data["androidSdk"]["apiLevel"] = 36
          data["androidSdk"]["platform"] = "android-36"
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\n")
          PYEOF
          out_parent="$RUNNER_TEMP/gate0a-drifted-declaration"
          rm -rf "$out_parent"
          output="$("$harness" --report-self-test --out-dir "$out_parent" 2>&1)"
          printf '%s\n' "$output"
          drifted_run_dir="$(printf '%s\n' "$output" | sed -n 's/.*CAS_GATE0A_REPORT_SELF_TEST_OK runDir=//p' | tail -n 1 | tr -d '\r')"
          if [[ -z "$drifted_run_dir" ]]; then
            echo "The harness did not complete the report self-test with a declared API 36 platform." >&2
            exit 1
          fi
          grep -q 'CAS_Pixel_8a_API_36' "$drifted_run_dir/report.json" || {
            echo "Report expectations do not reflect the declared API 36 pinned AVD." >&2
            exit 1
          }
          grep -q 'Pinned emulator API 36, or approved physical Pixel 11 on API 36 or newer' "$drifted_run_dir/report.json" || {
            echo "Report expectations do not reflect the declared API 36 minimum physical API." >&2
            exit 1
          }
          grep -P -q '^apiLevel\t36$' "$drifted_run_dir/environment.tsv" || {
            echo "The harness did not derive the recorded API level from the declared platform." >&2
            exit 1
          }
          echo "Declared API 36 produced a matching pinned-device contract in the report."
          # An inconsistent declaration must block explicitly, never silently default.
          python - "$(cygpath -w "$requirements")" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          data["androidSdk"]["apiLevel"] = 36
          data["androidSdk"]["platform"] = "android-35"
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\n")
          PYEOF
          set +e
          bad_output="$("$harness" --report-self-test --out-dir "$RUNNER_TEMP/gate0a-inconsistent-declaration" 2>&1)"
          bad_code=$?
          set -e
          printf '%s\n' "$bad_output"
          if [[ $bad_code -ne 2 ]]; then
            echo "An inconsistent tool-requirements.json did not block the harness with exit 2 (exit $bad_code)." >&2
            exit 1
          fi
          grep -q 'BLOCKED' <<<"$bad_output" || {
            echo "An inconsistent tool-requirements.json did not produce a BLOCKED message." >&2
            exit 1
          }
          echo "Inconsistent declaration blocked the harness explicitly, as required."

      - name: Generate a hardware-shaped report with the repo-only fixture generator
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            shim_dir="$RUNNER_TEMP/python3-shim"
            mkdir -p "$shim_dir"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$shim_dir/python3"
            chmod +x "$shim_dir/python3"
            export PATH="$shim_dir:$PATH"
          fi
          # The sample self-test is always evidenceClass=sample with preflight=WARN,
          # so it never exercises the physical-device import rules. This repo-only
          # generator (never packaged into the field kit) runs the harness's own
          # write_report() against a seeded default Pixel 11 run, so the fixture
          # carries the exact invariants of a completed hardware run.
          out_parent="$RUNNER_TEMP/gate0a-report-hwfixture"
          rm -rf "$out_parent"
          set +e
          output="$(bash scripts/generate-gate0a-hardware-report-fixture.sh --out-dir "$out_parent" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -ne 0 ]]; then
            echo "Hardware fixture generation exited $code." >&2
            exit 1
          fi
          report_path="$(printf '%s\n' "$output" | sed -n 's/.*GATE0A_HW_FIXTURE_OK report=//p' | tail -n 1 | tr -d '\r')"
          if [[ -z "$report_path" ]]; then
            echo "The generator exited 0 but did not report a successful fixture write." >&2
            exit 1
          fi
          echo "GATE0A_HW_REPORT=$report_path" >> "$GITHUB_ENV"
          # Independent verification: never trust the exit code or log alone.
          test -s "$report_path" || { echo "report.json is missing: $report_path" >&2; exit 1; }
          python - "$(cygpath -w "$report_path")" <<'PYEOF'
          import json, os, sys
          from datetime import datetime
          size = os.path.getsize(sys.argv[1])
          # The documented hardware report is ~250 KB; the fixture must stay
          # above the old 200 KB UI gate so a regressed size limit fails here.
          assert size > 200_000, size
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schema"] == "cas-gate0a-report-v2", report["schema"]
          assert report["evidenceClass"] == "physical-device-observation", report["evidenceClass"]
          assert report["status"] == "complete", report["status"]
          assert report["preflight"]["status"] == "PASS", report["preflight"]["status"]
          assert report["target"]["model"] == "Pixel 11", report["target"]["model"]
          assert report["target"]["isEmulator"] is False, report["target"]["isEmulator"]
          assert report["target"]["usbState"] == "device", report["target"]["usbState"]
          # Cross-field invariants the report writer must preserve.
          assert report["preflight"]["unresolvedWarnings"] == report["warnings"]
          assert report["summary"]["eventCount"] == len(report["events"]) == len(report["observations"])
          # The documented hardware run's exact volume: 219 events (200
          # repeats), one logcat capture per launch/navigation sample, all
          # referenced in evidence.logs.
          assert report["repeatCount"] == 200, report["repeatCount"]
          assert report["summary"]["eventCount"] == 219, report["summary"]["eventCount"]
          assert len(report["evidence"]["logs"]) > 200, len(report["evidence"]["logs"])
          counts = report["summary"]["eventCounts"]
          assert sum(counts.values()) == report["summary"]["eventCount"], counts
          started_ms = int(datetime.fromisoformat(report["startedAtUtc"].replace("Z", "+00:00")).timestamp() * 1000)
          assert abs(report["startedAtMs"] - started_ms) <= 2000, (report["startedAtMs"], started_ms)
          finished_ms = int(datetime.fromisoformat(report["finishedAtUtc"].replace("Z", "+00:00")).timestamp() * 1000)
          assert report["finishedAtMs"] == finished_ms, (report["finishedAtMs"], finished_ms)
          print("hardware-shaped report.json parsed; status:", report["status"])
          PYEOF

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install API server dependencies
        run: pnpm install --filter @workspace/api-server...

      - name: The self-test report must pass the web app's import validation
        shell: bash
        run: |
          set -euo pipefail
          # Runs the same validateGate0aImport rules as POST /api/cas/gate0a/import,
          # so a harness/app schema drift fails here instead of in the field.
          pnpm --filter @workspace/api-server run validate:gate0a-report \
            "$(cygpath -w "$GATE0A_RUN_DIR/report.json")"

      - name: The hardware-shaped report must pass the app's import validation
        shell: bash
        run: |
          set -euo pipefail
          # Same validateGate0aImport rules as POST /api/cas/gate0a/import, now
          # against the physical-device-observation shape: Pixel 11 identity,
          # authorized adb state, and the real package hash are all checked.
          pnpm --filter @workspace/api-server run validate:gate0a-report \
            "$(cygpath -w "$GATE0A_HW_REPORT")"

      - name: A physical report from an unapproved device model must be rejected
        shell: bash
        run: |
          set -euo pipefail
          # Import validation must only accept physical evidence from the
          # approved Pixel 11 target; derive the negative case from the passing
          # hardware report so it fails exactly on the device-model rule.
          unapproved="$RUNNER_TEMP/gate0a-report-unapproved-model.json"
          python - "$(cygpath -w "$GATE0A_HW_REPORT")" "$(cygpath -w "$unapproved")" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          report["target"]["model"] = "Pixel 10"
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(report, handle)
          PYEOF
          set +e
          output="$(pnpm --filter @workspace/api-server run validate:gate0a-report "$(cygpath -w "$unapproved")" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -eq 0 ]]; then
            echo "The validator accepted a physical report from an unapproved device model." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q "REJECTED" || {
            echo "The validator failed without reporting a rejection reason." >&2
            exit 1
          }
          echo "Unapproved-device physical report rejected by the app's import validation, as required."

      - name: A report the app would reject must fail validation
        shell: bash
        run: |
          set -euo pipefail
          drifted="$RUNNER_TEMP/gate0a-report-drifted.json"
          python - "$(cygpath -w "$GATE0A_RUN_DIR/report.json")" "$(cygpath -w "$drifted")" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          report["schema"] = "cas-gate0a-report-v1"
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(report, handle)
          PYEOF
          set +e
          output="$(pnpm --filter @workspace/api-server run validate:gate0a-report "$(cygpath -w "$drifted")" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -eq 0 ]]; then
            echo "The validator accepted a report the web app would reject." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q "REJECTED" || {
            echo "The validator failed without reporting a rejection reason." >&2
            exit 1
          }
          echo "Drifted report rejected by the app's import validation, as required."

      - name: A failed report write must not exit successfully
        shell: bash
        run: |
          set -euo pipefail
          # Force write_report() to fail by shadowing python3 with a broken shim.
          shim_dir="$RUNNER_TEMP/broken-python3"
          mkdir -p "$shim_dir"
          printf '#!/usr/bin/env bash\nexit 1\n' > "$shim_dir/python3"
          chmod +x "$shim_dir/python3"
          harness="$(cygpath "$PACKAGED_KIT_ROOT")/scripts/measure-gate0a.sh"
          out_parent="$RUNNER_TEMP/gate0a-report-negative"
          rm -rf "$out_parent"
          set +e
          PATH="$shim_dir:$PATH" "$harness" --report-self-test --out-dir "$out_parent" > "$RUNNER_TEMP/gate0a-negative.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/gate0a-negative.log"
          if [[ $code -eq 0 ]]; then
            echo "The harness exited 0 although python3 failed and no report could be written." >&2
            exit 1
          fi
          if find "$out_parent" \( -name report.json -o -name report.md \) 2>/dev/null | grep -q .; then
            echo "A report file exists even though the report write failed." >&2
            exit 1
          fi
          echo "Blocked report write produced a non-zero exit and no report files."
