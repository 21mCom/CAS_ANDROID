name: API server route tests

# Runs the api-server contract suite (artifacts/api-server/src/routes/cas.test.ts
# and the sibling lib/script tests wired into `pnpm --filter @workspace/api-server test`)
# so a breaking change to the per-device credential gate, revocation, receipt
# handling, or the delivery-provider contract cannot merge green.
on:
  push:
    paths:
      - "artifacts/api-server/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      # The migration-freshness gate reads the committed drizzle migrations
      # and this script; an edit to either must re-run the gate.
      - "scripts/check-db-migrations-freshness.sh"
      - "scripts/run-cas-contract-tests.mjs"
      - "scripts/disposable-review-database.mjs"
      # The burst-alert log-key drift gate reads this script; an edit to it
      # must re-run the gate or a weakened check could merge green.
      - "scripts/check-burst-alert-log-key.sh"
      # The console parity test reads this hook from disk; a console-side type
      # change must re-run the gate or a schema/console drift could merge green.
      - "artifacts/covert-alert-system/src/hooks/use-field-test.tsx"
      # The outbox/config parity test (cas-outbox-config-schema.test.ts) reads
      # these console mirror schemas from disk and the route tests import them,
      # so a console-side edit must re-run the gate too.
      - "artifacts/covert-alert-system/src/lib/cas-outbox-status-schema.ts"
      - "artifacts/covert-alert-system/src/lib/cas-config-schema.ts"
      - "artifacts/covert-alert-system/src/lib/cas-state-schema.ts"
      - ".github/workflows/api-server-tests.yml"
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      # The migration-freshness gate reads the committed drizzle migrations
      # and this script; an edit to either must re-run the gate.
      - "scripts/check-db-migrations-freshness.sh"
      - "scripts/run-cas-contract-tests.mjs"
      - "scripts/disposable-review-database.mjs"
      # The burst-alert log-key drift gate reads this script; an edit to it
      # must re-run the gate or a weakened check could merge green.
      - "scripts/check-burst-alert-log-key.sh"
      # The console parity test reads this hook from disk; a console-side type
      # change must re-run the gate or a schema/console drift could merge green.
      - "artifacts/covert-alert-system/src/hooks/use-field-test.tsx"
      # The outbox/config parity test (cas-outbox-config-schema.test.ts) reads
      # these console mirror schemas from disk and the route tests import them,
      # so a console-side edit must re-run the gate too.
      - "artifacts/covert-alert-system/src/lib/cas-outbox-status-schema.ts"
      - "artifacts/covert-alert-system/src/lib/cas-config-schema.ts"
      - "artifacts/covert-alert-system/src/lib/cas-state-schema.ts"
      - ".github/workflows/api-server-tests.yml"

jobs:
  route-tests:
    name: Run the api-server contract tests against a disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Put the preinstalled PostgreSQL server binaries on PATH
        run: |
          set -euo pipefail
          # The test command bootstraps its own throwaway cluster via
          # scripts/disposable-review-database.mjs, which needs initdb, pg_ctl,
          # and createdb. ubuntu-latest ships PostgreSQL but keeps the server
          # binaries off PATH, so expose them here. Fail loudly if a future
          # runner image drops the package instead of silently skipping.
          pgbin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          if [ ! -x "$pgbin/initdb" ]; then
            echo "::error::No initdb found under /usr/lib/postgresql — runner image changed?"
            exit 1
          fi
          echo "$pgbin" >> "$GITHUB_PATH"
          echo "Using PostgreSQL binaries from $pgbin"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/api-server...

      - name: Run the api-server contract tests
        # The established test command: provisions a disposable PostgreSQL
        # cluster, pushes the drizzle schema into it, runs every route/lib test
        # under node --test, and tears the cluster down on pass or fail.
        run: pnpm --filter @workspace/api-server test

  burst-alert-log-key:
    name: Runbook burst-alert match string must match the emitted log key
    # SELF-HOSTING.md Step 10 tells the operator to grep the journal for a
    # literal string, and defaultBurstRecorder in cas-auth.ts emits the line
    # that grep is meant to catch. Nothing else ties the two together, so a
    # rename on either side compiles fine and the operator finds out the day a
    # real probing attack goes unalerted. This job runs the drift gate and
    # then proves both one-sided edits turn it red.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Runbook burst-alert recipe must match the emitted log key
        run: |
          set -euo pipefail
          bash scripts/check-burst-alert-log-key.sh

      - name: A renamed log key in cas-auth.ts must turn the gate red
        run: |
          set -euo pipefail
          # Negative test: rename the emitted key in code WITHOUT touching the
          # runbook, then require the gate to fail. Only the checkout is
          # modified; the workflow restores the file afterwards.
          code="artifacts/api-server/src/lib/cas-auth.ts"
          grep -q 'casAuthRejectionBurst' "$code"
          sed -i 's/casAuthRejectionBurst/casAuthBurstRenamed/' "$code"
          trap 'git checkout -- "$code"' EXIT
          set +e
          output="$(bash scripts/check-burst-alert-log-key.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -eq 0 ]]; then
            echo "The drift gate accepted a renamed burst log key the runbook no longer greps for." >&2
            exit 1
          fi
          grep -q 'BURST_ALERT_LOG_KEY_FAILED' <<<"$output" || {
            echo "The drift gate failed without reporting the burst-alert mismatch." >&2
            exit 1
          }
          echo "A renamed log key in cas-auth.ts turned the gate red, as required."

      - name: A renamed WATCHDOG-ONLY match string must turn the gate red
        run: |
          set -euo pipefail
          # Negative test: change ONLY the watchdog script's grep, leaving the
          # manual diagnostic command further down untouched. The gate must
          # still fail — the manual grep must not be able to satisfy the check
          # while the alert itself matches a string the server never emits.
          # Only the checkout is modified; the workflow restores the file.
          runbook="artifacts/api-server/SELF-HOSTING.md"
          grep -q "if grep 'casAuthRejectionBurst'" "$runbook"
          sed -i "s/if grep 'casAuthRejectionBurst'/if grep 'casAuthBurstRenamed'/" "$runbook"
          grep -q 'casAuthRejectionBurst' "$runbook"  # the manual command still uses the real key
          trap 'git checkout -- "$runbook"' EXIT
          set +e
          output="$(bash scripts/check-burst-alert-log-key.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -eq 0 ]]; then
            echo "The drift gate accepted a watchdog-only rename because the manual grep still matched." >&2
            exit 1
          fi
          grep -q 'BURST_ALERT_LOG_KEY_FAILED' <<<"$output" || {
            echo "The drift gate failed without reporting the burst-alert mismatch." >&2
            exit 1
          }
          echo "A watchdog-only rename turned the gate red, as required."

      - name: A REMOVED watchdog grep must turn the gate red
        run: |
          set -euo pipefail
          # Negative test: delete ONLY the watchdog script's grep line, leaving
          # the manual diagnostic command intact. The gate must still fail —
          # an alert that no longer greps at all is broken even while the
          # section still mentions the right key.
          runbook="artifacts/api-server/SELF-HOSTING.md"
          grep -q "if grep 'casAuthRejectionBurst'" "$runbook"
          sed -i "\|if grep 'casAuthRejectionBurst'|d" "$runbook"
          grep -q 'casAuthRejectionBurst' "$runbook"  # the manual command still uses the real key
          trap 'git checkout -- "$runbook"' EXIT
          set +e
          output="$(bash scripts/check-burst-alert-log-key.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -eq 0 ]]; then
            echo "The drift gate accepted a watchdog script that no longer greps for anything." >&2
            exit 1
          fi
          grep -q 'BURST_ALERT_LOG_KEY_FAILED' <<<"$output" || {
            echo "The drift gate failed without reporting the burst-alert mismatch." >&2
            exit 1
          }
          echo "A removed watchdog grep turned the gate red, as required."

  db-migrations-freshness:
    name: Committed drizzle migrations must match the schema
    # The api-server applies lib/db/drizzle at boot in production
    # (src/lib/db-schema-ensure.ts). A schema edit without a regenerated,
    # committed migration would deploy green while the live database silently
    # keeps the old shape. This job runs the freshness gate and then proves a
    # schema-only edit turns it red.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Committed migrations match the schema
        run: |
          set -euo pipefail
          bash scripts/check-db-migrations-freshness.sh

      - name: A schema-only edit must turn the gate red
        run: |
          set -euo pipefail
          # Negative test: rename a column in the schema WITHOUT regenerating
          # migrations, then require the gate to fail. Only the checkout is
          # modified; the workflow restores the file afterwards.
          schema="lib/db/src/schema/cas.ts"
          grep -q 'text("label")' "$schema"
          sed -i 's/text("label")/text("label_renamed")/' "$schema"
          trap 'git checkout -- "$schema"' EXIT
          set +e
          output="$(bash scripts/check-db-migrations-freshness.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -eq 0 ]]; then
            echo "The freshness gate accepted a schema edit with stale committed migrations." >&2
            exit 1
          fi
          grep -q 'MIGRATIONS_FRESHNESS_FAILED' <<<"$output" || {
            echo "The freshness gate failed without reporting the migrations drift." >&2
            exit 1
          }
          echo "A schema-only edit turned the gate red, as required."
