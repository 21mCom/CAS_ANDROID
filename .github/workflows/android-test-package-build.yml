name: Android test package build

on:
  pull_request:
    paths:
      - ".github/workflows/android-test-package-build.yml"
      - ".github/scripts/check-apk-manifest.py"
      - ".github/scripts/verify-sms-flow.sh"
      - "artifacts/covert-alert-system/android-test-package/**"
      - "scripts/test-receipt-durability.sh"
      - "scripts/receipt-durability/**"
      # The sms-receipt-flow job gates the handset-facing API contract too, so
      # API server and schema changes must trigger this workflow.
      - "artifacts/api-server/**"
      - "lib/db/**"
  push:
    paths:
      - ".github/workflows/android-test-package-build.yml"
      - ".github/scripts/check-apk-manifest.py"
      - ".github/scripts/verify-sms-flow.sh"
      - "artifacts/covert-alert-system/android-test-package/**"
      - "scripts/test-receipt-durability.sh"
      - "scripts/receipt-durability/**"
      - "artifacts/api-server/**"
      - "lib/db/**"
  workflow_dispatch:

jobs:
  receipt-durability:
    name: Receipt durability harness (JVM, no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The script downloads its own pinned kotlinc + org.json jar into
      # scripts/.cache (sha256-verified) and proves the handset's
      # batch→receipt handoff survives process death at every boundary.
      - name: Run receipt durability harness
        run: scripts/test-receipt-durability.sh

  assemble-debug:
    name: Compile Gate 0A debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tool requirements
        id: tool-requirements
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # tool-requirements.json is the single source of truth shared with
          # the Windows workstation preflight (scripts/windows-preflight.ps1),
          # the same way gradle-version.txt pins the Gradle release.
          jdk="$(jq -er '.jdk.minimumMajor' tool-requirements.json)"
          api="$(jq -er '.androidSdk.apiLevel' tool-requirements.json)"
          bt="$(jq -er '.androidSdk.buildToolsMinimum' tool-requirements.json)"
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
          echo "api-level=$api" >> "$GITHUB_OUTPUT"
          echo "build-tools=$bt" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.tool-requirements.outputs.jdk }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and verify the declared SDK platform and build-tools
        env:
          API_LEVEL: ${{ steps.tool-requirements.outputs.api-level }}
          BUILD_TOOLS_MIN: ${{ steps.tool-requirements.outputs.build-tools }}
        run: |
          set -euo pipefail
          # CI must satisfy the same declaration the Windows preflight enforces;
          # building with whatever the runner happens to ship would let CI stay
          # green on a toolchain the field kit would reject.
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-$API_LEVEL" "build-tools;$BUILD_TOOLS_MIN" > /dev/null
          jar="$ANDROID_HOME/platforms/android-$API_LEVEL/android.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Declared platform android-$API_LEVEL is missing ($jar) after sdkmanager install."
            exit 1
          fi
          newest="$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          if [ "$(printf '%s\n%s\n' "$newest" "$BUILD_TOOLS_MIN" | sort -V | head -1)" != "$BUILD_TOOLS_MIN" ]; then
            echo "::error::Newest installed build-tools $newest is below the declared minimum $BUILD_TOOLS_MIN."
            exit 1
          fi
          echo "SDK satisfies tool-requirements.json: platform android-$API_LEVEL present, build-tools $newest >= $BUILD_TOOLS_MIN."

      - name: Read pinned Gradle version
        id: gradle-version
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # gradle-version.txt is the single source of truth shared with the
          # Windows workstation preflight (scripts/windows-preflight.ps1).
          version="$(tr -d '[:space:]' < gradle-version.txt)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::gradle-version.txt does not contain a Gradle version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Compile debug APK
        working-directory: artifacts/covert-alert-system/android-test-package
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output exists
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Gradle reported success but $apk is missing."
            exit 1
          fi
          echo "APK built: $apk ($(stat -c%s "$apk") bytes)"

      - name: Verify PROXY_TRIGGER filter declares CATEGORY_DEFAULT
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # The install/verify step above guarantees the newest build-tools
          # release is at or above the declared minimum, so this aapt always
          # comes from a qualifying release.
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/apk-manifest.txt
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-apk-manifest.py" /tmp/apk-manifest.txt

      - name: Upload debug APK for the emulator smoke test
        uses: actions/upload-artifact@v4
        with:
          name: gate0a-app-debug-apk
          path: artifacts/covert-alert-system/android-test-package/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  launch-smoke-test:
    name: Boot emulator and launch MainActivity + PROXY_TRIGGER + BOOT_COMPLETED + LOCKED_BOOT_COMPLETED
    needs: assemble-debug
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tool requirements
        id: tool-requirements
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # Same source of truth as the assemble job and the Windows preflight.
          echo "jdk=$(jq -er '.jdk.minimumMajor' tool-requirements.json)" >> "$GITHUB_OUTPUT"
          echo "api-level=$(jq -er '.androidSdk.apiLevel' tool-requirements.json)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.tool-requirements.outputs.jdk }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: gate0a-app-debug-apk
          path: apk

      - name: Boot emulator, install APK, launch MainActivity and TriggerActivity, send BOOT_COMPLETED and LOCKED_BOOT_COMPLETED
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.tool-requirements.outputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            apk="apk/app-debug.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::Downloaded APK missing at $apk"
              exit 1
            fi
            adb install -r "$apk"
            # Clear logcat after install noise so crash detection below only
            # sees output produced by the launch itself.
            adb logcat -c
            if ! adb shell am start -W -n com.covertalert.pixeltest/.MainActivity; then
              echo "::error::am start failed — MainActivity did not launch."
              adb logcat -d | tail -200
              exit 1
            fi
            sleep 8
            pid="$(adb shell pidof com.covertalert.pixeltest || true)"
            if [ -z "$pid" ]; then
              echo "::error::App process is not running 8s after launch — crash on launch."
              # Surface the fatal block itself first: on a slow or noisy
              # emulator the crash can scroll out of a plain tail -200.
              adb logcat -d | grep -B2 -A30 'FATAL EXCEPTION' || true
              adb logcat -d | tail -200
              exit 1
            fi
            crashes="$(adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL|Force finishing activity com\.covertalert\.pixeltest' || true)"
            if [ -n "$crashes" ]; then
              echo "::error::Fatal crash detected in logcat after MainActivity launch."
              echo "$crashes"
              adb logcat -d | tail -200
              exit 1
            fi
            echo "MainActivity check passed: launched, process alive (pid $pid), no fatal logcat entries."
            # Second entry point: the pinned field shortcut fires the
            # PROXY_TRIGGER intent, which opens TriggerActivity. A crash there
            # (bad theme, shortcuts.xml mismatch, onCreate assumption) would
            # otherwise only be discovered on the field device. Re-clear
            # logcat so the checks below only see output from this launch.
            adb logcat -c
            if ! adb shell am start -W -a com.covertalert.pixeltest.action.PROXY_TRIGGER; then
              echo "::error::am start failed — PROXY_TRIGGER intent did not resolve to TriggerActivity."
              adb logcat -d | tail -200
              exit 1
            fi
            sleep 8
            # TriggerActivity finishes itself after forwarding, but the app
            # process (still hosting MainActivity) must survive; an uncaught
            # exception in TriggerActivity kills the whole process.
            pid="$(adb shell pidof com.covertalert.pixeltest || true)"
            if [ -z "$pid" ]; then
              echo "::error::App process is not running 8s after PROXY_TRIGGER launch — TriggerActivity crashed."
              adb logcat -d | tail -200
              exit 1
            fi
            crashes="$(adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL|Force finishing activity com\.covertalert\.pixeltest' || true)"
            if [ -n "$crashes" ]; then
              echo "::error::Fatal crash detected in logcat after PROXY_TRIGGER launch."
              echo "$crashes"
              adb logcat -d | tail -200
              exit 1
            fi
            echo "TriggerActivity check passed: PROXY_TRIGGER launched, process alive (pid $pid), no fatal logcat entries."
            # Third entry point: BootReceiver handles BOOT_COMPLETED (the
            # field device must survive a reboot). A crash here (bad
            # direct-boot assumption, Theme/context misuse) would otherwise
            # only be discovered on the field device after a reboot.
            # BOOT_COMPLETED is a protected broadcast: the default adb shell
            # user (uid 2000) is NOT permitted to send it on API 35
            # (SecurityException, verified on a real emulator), but the
            # google_apis image is rootable — restart adbd as root first.
            adb root
            adb wait-for-device
            if ! adb shell id | grep -q "uid=0"; then
              echo "::error::adb root did not yield a root shell — cannot send the protected BOOT_COMPLETED broadcast."
              exit 1
            fi
            # Re-clear logcat so the checks below only see output from this
            # broadcast.
            adb logcat -c
            if ! adb shell am broadcast -a android.intent.action.BOOT_COMPLETED -p com.covertalert.pixeltest; then
              echo "::error::am broadcast failed — BOOT_COMPLETED was not delivered to BootReceiver."
              adb logcat -d | tail -200
              exit 1
            fi
            sleep 8
            # A crashing receiver kills the hosting app process, so the
            # process started by MainActivity above must still be alive.
            pid="$(adb shell pidof com.covertalert.pixeltest || true)"
            if [ -z "$pid" ]; then
              echo "::error::App process is not running 8s after BOOT_COMPLETED — BootReceiver crashed."
              adb logcat -d | grep -B2 -A30 'FATAL EXCEPTION' || true
              adb logcat -d | tail -200
              exit 1
            fi
            crashes="$(adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL|Force finishing activity com\.covertalert\.pixeltest' || true)"
            if [ -n "$crashes" ]; then
              echo "::error::Fatal crash detected in logcat after BOOT_COMPLETED broadcast."
              echo "$crashes"
              adb logcat -d | tail -200
              exit 1
            fi
            echo "BootReceiver (BOOT_COMPLETED) check passed: broadcast delivered, process alive (pid $pid), no fatal logcat entries."
            # Fourth entry point: the REAL pre-unlock (direct-boot) path.
            # BootReceiver is directBootAware and handles LOCKED_BOOT_COMPLETED,
            # delivered by the system BEFORE the user unlocks the device.
            # Injecting that action with `am broadcast` after unlock would NOT
            # exercise direct boot: credential-encrypted (CE) storage is
            # already available then, so a regression that touches CE storage
            # in onReceive (e.g. TestStore switched from
            # createDeviceProtectedStorageContext to plain getSharedPreferences)
            # would stay green here and only crash on a field device rebooting
            # to the lock screen. Instead: set a lockscreen PIN so the next
            # boot keeps user 0 LOCKED until credentials are entered, reboot,
            # and let the SYSTEM deliver LOCKED_BOOT_COMPLETED naturally in
            # the direct-boot phase. Uses the root shell acquired above;
            # locksettings needs it (and a userdebug/google_apis image).
            if ! adb shell locksettings set-pin 1234; then
              echo "::error::locksettings set-pin failed — cannot force the emulator into the locked (direct-boot) state."
              exit 1
            fi
            # Calibrate the locked-state probe while the device is known to be
            # unlocked: CE storage must report available. If it does not read
            # "true" here, the property cannot prove anything after the reboot
            # and this job must fail loudly rather than claim direct-boot
            # coverage it cannot verify.
            ce_now="$(adb shell getprop sys.user.0.ce_available | tr -d '[:space:]')"
            if [ "$ce_now" != "true" ]; then
              echo "::error::sys.user.0.ce_available reads '$ce_now' on an unlocked emulator — the locked-state probe is untrustworthy; refusing to claim direct-boot coverage."
              exit 1
            fi
            # Re-clear logcat so post-reboot output belongs to the locked-boot
            # phase only (the natural LOCKED_BOOT_COMPLETED delivery happens
            # during boot, before we could clear).
            adb logcat -c
            adb reboot
            adb wait-for-device
            booted=""
            for i in $(seq 1 60); do
              bc="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')"
              if [ "$bc" = "1" ]; then booted=1; break; fi
              sleep 5
            done
            if [ -z "$booted" ]; then
              echo "::error::Emulator did not finish the PIN-protected reboot within 5 minutes."
              exit 1
            fi
            # adbd may drop root across the reboot; re-acquire it before
            # reading /data/user_de below.
            adb root
            adb wait-for-device
            if ! adb shell id | grep -q "uid=0"; then
              echo "::error::adb root did not yield a root shell after reboot — cannot read device-protected storage for the delivery-evidence check."
              exit 1
            fi
            # Explicitly assert the precondition that makes this phase
            # meaningful: user 0 is STILL LOCKED (credential-encrypted storage
            # unavailable). Without this, everything below proves nothing
            # about the pre-unlock path.
            ce_after="$(adb shell getprop sys.user.0.ce_available | tr -d '[:space:]')"
            if [ "$ce_after" = "true" ]; then
              echo "::error::sys.user.0.ce_available is still 'true' after a PIN-protected reboot — the device is NOT in the locked/direct-boot state; cannot validate the pre-unlock path."
              exit 1
            fi
            echo "Locked-state precondition holds: user 0 still locked after PIN-protected reboot (ce_available='$ce_after', was 'true' while unlocked)."
            adb shell dumpsys user | grep -E '^[[:space:]]+0: ' || true
            sleep 5
            # Crash detection, scoped to our package (FATAL EXCEPTION blocks
            # name the process on the following lines, so another component's
            # boot-time crash cannot false-positive here). Note pidof is NOT
            # a valid detector in this phase: pre-unlock the app has no reason
            # to keep a process alive after the receiver returns.
            if adb logcat -d | grep -A2 'FATAL EXCEPTION' | grep -q 'Process: com.covertalert.pixeltest'; then
              echo "::error::BootReceiver crashed during locked (pre-unlock) boot — FATAL EXCEPTION for com.covertalert.pixeltest in logcat."
              adb logcat -d | grep -B2 -A30 'FATAL EXCEPTION' || true
              adb logcat -d | tail -200
              exit 1
            fi
            # Delivery evidence: BootReceiver journals BOOT_OBSERVED into
            # device-protected storage (TestStore), which is exactly the
            # storage available pre-unlock. Assert the LOCKED_BOOT_COMPLETED
            # event is there — without this the phase would be green even if
            # the receiver silently never ran (e.g. a manifest regression
            # dropping directBootAware or the intent-filter).
            journal="$(adb shell cat /data/user_de/0/com.covertalert.pixeltest/shared_prefs/gate0a-local-journal.xml 2>/dev/null || true)"
            if ! echo "$journal" | grep -q 'LOCKED_BOOT_COMPLETED'; then
              echo "::error::No LOCKED_BOOT_COMPLETED event in the device-protected journal — BootReceiver did not record the pre-unlock broadcast (or never ran)."
              echo "$journal"
              adb logcat -d | tail -200
              exit 1
            fi
            echo "Smoke test passed: MainActivity, TriggerActivity (PROXY_TRIGGER), BootReceiver (BOOT_COMPLETED), and BootReceiver (LOCKED_BOOT_COMPLETED, verified while user 0 locked) all exercised; pre-unlock journal entry present; no fatal logcat entries."

  sms-receipt-flow-test:
    name: Drive the handset SMS send/receipt/re-queue flow against a dev API
    needs: assemble-debug
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      # Throwaway credential for the ephemeral CI database; the handset
      # endpoints fail closed without one, so the job sets a literal value on
      # both sides. Not a real secret — the database dies with the runner.
      CAS_FLOW_DEVICE_TOKEN: emulator-flow-token
      # Synthetic credential for the trigger/re-queue gate (CAS_ALERT_TOKEN);
      # matches what verify-sms-flow.sh presents as its Bearer token.
      CAS_FLOW_ALERT_TOKEN: emulator-flow-alert-token
      CAS_FLOW_API_PORT: "5055"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tool requirements
        id: tool-requirements
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # Same source of truth as the assemble job and the Windows preflight.
          echo "jdk=$(jq -er '.jdk.minimumMajor' tool-requirements.json)" >> "$GITHUB_OUTPUT"
          echo "api-level=$(jq -er '.androidSdk.apiLevel' tool-requirements.json)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.tool-requirements.outputs.jdk }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pnpm and Node
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: gate0a-app-debug-apk
          path: apk

      - name: Start a disposable PostgreSQL
        run: |
          set -euo pipefail
          # Service containers do not exist on macOS runners; the images ship
          # PostgreSQL via Homebrew, so bootstrap a throwaway cluster exactly
          # like scripts/disposable-review-database.mjs does locally.
          brew list --versions postgresql@14 > /dev/null 2>&1 || brew install postgresql@14
          pgbin="$(brew --prefix postgresql@14)/bin"
          pgdata="$RUNNER_TEMP/cas-flow-pg"
          "$pgbin/initdb" --no-locale --encoding=UTF8 --auth=trust --username runner -D "$pgdata" > /dev/null
          "$pgbin/pg_ctl" -D "$pgdata" -o "-h 127.0.0.1 -k $pgdata -p 5432" -w start > /dev/null
          "$pgbin/createdb" -h 127.0.0.1 -p 5432 -U runner cas_flow
          echo "DATABASE_URL=postgresql://runner@127.0.0.1:5432/cas_flow" >> "$GITHUB_ENV"

      - name: Install workspace dependencies and push the schema
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @workspace/api-server...
          pnpm --filter @workspace/db run push-force

      - name: Start the dev API in device-delivery mode
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server run build
          PORT=${{ env.CAS_FLOW_API_PORT }} NODE_ENV=development \
            CAS_SMS_DELIVERY_MODE=device CAS_DEVICE_TOKEN="$CAS_FLOW_DEVICE_TOKEN" \
            CAS_ALERT_TOKEN="$CAS_FLOW_ALERT_TOKEN" \
            DATABASE_URL="$DATABASE_URL" \
            nohup node artifacts/api-server/dist/index.mjs > /tmp/cas-flow-api.log 2>&1 &
          up=""
          for i in $(seq 1 45); do
            if curl -s "http://127.0.0.1:${{ env.CAS_FLOW_API_PORT }}/api/cas/state" > /dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "::error::dev API never came up"
            tail -50 /tmp/cas-flow-api.log || true
            exit 1
          fi
          echo "dev API is up on port ${{ env.CAS_FLOW_API_PORT }} (CAS_SMS_DELIVERY_MODE=device)"

      - name: Boot emulator and prove send + receipt + re-queue pickup
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAS_FLOW_API_HOST: http://127.0.0.1:${{ env.CAS_FLOW_API_PORT }}
        with:
          api-level: ${{ steps.tool-requirements.outputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            apk="apk/app-debug.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::Downloaded APK missing at $apk"
              exit 1
            fi
            # The harness owns the whole flow: adb reverse tunnel, contract
            # preflight, bad-number DEAD_LETTER, console re-queue,
            # device-pending pickup, fixed-number SENT, plus on-device journal
            # evidence. Any drift in the sms-receipt or device-pending
            # contract fails this step loudly.
            CAS_FLOW_APK="$apk" bash .github/scripts/verify-sms-flow.sh
