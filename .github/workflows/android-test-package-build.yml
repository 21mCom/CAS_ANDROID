name: Android test package build

on:
  pull_request:
    paths:
      - ".github/workflows/android-test-package-build.yml"
      - ".github/scripts/check-apk-manifest.py"
      - "artifacts/covert-alert-system/android-test-package/**"
  push:
    paths:
      - ".github/workflows/android-test-package-build.yml"
      - ".github/scripts/check-apk-manifest.py"
      - "artifacts/covert-alert-system/android-test-package/**"
  workflow_dispatch:

jobs:
  assemble-debug:
    name: Compile Gate 0A debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tool requirements
        id: tool-requirements
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # tool-requirements.json is the single source of truth shared with
          # the Windows workstation preflight (scripts/windows-preflight.ps1),
          # the same way gradle-version.txt pins the Gradle release.
          jdk="$(jq -er '.jdk.minimumMajor' tool-requirements.json)"
          api="$(jq -er '.androidSdk.apiLevel' tool-requirements.json)"
          bt="$(jq -er '.androidSdk.buildToolsMinimum' tool-requirements.json)"
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
          echo "api-level=$api" >> "$GITHUB_OUTPUT"
          echo "build-tools=$bt" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.tool-requirements.outputs.jdk }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and verify the declared SDK platform and build-tools
        env:
          API_LEVEL: ${{ steps.tool-requirements.outputs.api-level }}
          BUILD_TOOLS_MIN: ${{ steps.tool-requirements.outputs.build-tools }}
        run: |
          set -euo pipefail
          # CI must satisfy the same declaration the Windows preflight enforces;
          # building with whatever the runner happens to ship would let CI stay
          # green on a toolchain the field kit would reject.
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-$API_LEVEL" "build-tools;$BUILD_TOOLS_MIN" > /dev/null
          jar="$ANDROID_HOME/platforms/android-$API_LEVEL/android.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Declared platform android-$API_LEVEL is missing ($jar) after sdkmanager install."
            exit 1
          fi
          newest="$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          if [ "$(printf '%s\n%s\n' "$newest" "$BUILD_TOOLS_MIN" | sort -V | head -1)" != "$BUILD_TOOLS_MIN" ]; then
            echo "::error::Newest installed build-tools $newest is below the declared minimum $BUILD_TOOLS_MIN."
            exit 1
          fi
          echo "SDK satisfies tool-requirements.json: platform android-$API_LEVEL present, build-tools $newest >= $BUILD_TOOLS_MIN."

      - name: Read pinned Gradle version
        id: gradle-version
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # gradle-version.txt is the single source of truth shared with the
          # Windows workstation preflight (scripts/windows-preflight.ps1).
          version="$(tr -d '[:space:]' < gradle-version.txt)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::gradle-version.txt does not contain a Gradle version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Compile debug APK
        working-directory: artifacts/covert-alert-system/android-test-package
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output exists
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Gradle reported success but $apk is missing."
            exit 1
          fi
          echo "APK built: $apk ($(stat -c%s "$apk") bytes)"

      - name: Verify PROXY_TRIGGER filter declares CATEGORY_DEFAULT
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # The install/verify step above guarantees the newest build-tools
          # release is at or above the declared minimum, so this aapt always
          # comes from a qualifying release.
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/apk-manifest.txt
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-apk-manifest.py" /tmp/apk-manifest.txt

      - name: Upload debug APK for the emulator smoke test
        uses: actions/upload-artifact@v4
        with:
          name: gate0a-app-debug-apk
          path: artifacts/covert-alert-system/android-test-package/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  launch-smoke-test:
    name: Boot emulator and launch MainActivity + PROXY_TRIGGER
    needs: assemble-debug
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tool requirements
        id: tool-requirements
        working-directory: artifacts/covert-alert-system/android-test-package
        run: |
          set -euo pipefail
          # Same source of truth as the assemble job and the Windows preflight.
          echo "jdk=$(jq -er '.jdk.minimumMajor' tool-requirements.json)" >> "$GITHUB_OUTPUT"
          echo "api-level=$(jq -er '.androidSdk.apiLevel' tool-requirements.json)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.tool-requirements.outputs.jdk }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: gate0a-app-debug-apk
          path: apk

      - name: Boot emulator, install APK, launch MainActivity and TriggerActivity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.tool-requirements.outputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            apk="apk/app-debug.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::Downloaded APK missing at $apk"
              exit 1
            fi
            adb install -r "$apk"
            # Clear logcat after install noise so crash detection below only
            # sees output produced by the launch itself.
            adb logcat -c
            if ! adb shell am start -W -n com.covertalert.pixeltest/.MainActivity; then
              echo "::error::am start failed — MainActivity did not launch."
              adb logcat -d | tail -200
              exit 1
            fi
            sleep 8
            pid="$(adb shell pidof com.covertalert.pixeltest || true)"
            if [ -z "$pid" ]; then
              echo "::error::App process is not running 8s after launch — crash on launch."
              # Surface the fatal block itself first: on a slow or noisy
              # emulator the crash can scroll out of a plain tail -200.
              adb logcat -d | grep -B2 -A30 'FATAL EXCEPTION' || true
              adb logcat -d | tail -200
              exit 1
            fi
            crashes="$(adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL|Force finishing activity com\.covertalert\.pixeltest' || true)"
            if [ -n "$crashes" ]; then
              echo "::error::Fatal crash detected in logcat after MainActivity launch."
              echo "$crashes"
              adb logcat -d | tail -200
              exit 1
            fi
            echo "MainActivity check passed: launched, process alive (pid $pid), no fatal logcat entries."
            # Second entry point: the pinned field shortcut fires the
            # PROXY_TRIGGER intent, which opens TriggerActivity. A crash there
            # (bad theme, shortcuts.xml mismatch, onCreate assumption) would
            # otherwise only be discovered on the field device. Re-clear
            # logcat so the checks below only see output from this launch.
            adb logcat -c
            if ! adb shell am start -W -a com.covertalert.pixeltest.action.PROXY_TRIGGER; then
              echo "::error::am start failed — PROXY_TRIGGER intent did not resolve to TriggerActivity."
              adb logcat -d | tail -200
              exit 1
            fi
            sleep 8
            # TriggerActivity finishes itself after forwarding, but the app
            # process (still hosting MainActivity) must survive; an uncaught
            # exception in TriggerActivity kills the whole process.
            pid="$(adb shell pidof com.covertalert.pixeltest || true)"
            if [ -z "$pid" ]; then
              echo "::error::App process is not running 8s after PROXY_TRIGGER launch — TriggerActivity crashed."
              adb logcat -d | tail -200
              exit 1
            fi
            crashes="$(adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL|Force finishing activity com\.covertalert\.pixeltest' || true)"
            if [ -n "$crashes" ]; then
              echo "::error::Fatal crash detected in logcat after PROXY_TRIGGER launch."
              echo "$crashes"
              adb logcat -d | tail -200
              exit 1
            fi
            echo "Smoke test passed: MainActivity and TriggerActivity (PROXY_TRIGGER) launched, process alive (pid $pid), no fatal logcat entries."
